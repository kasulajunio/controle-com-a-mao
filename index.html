<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Mão Mágica</title><style>*{box-sizing:border-box}body{margin:0;background:#071015;color:#fff;font-family:system-ui;overflow:hidden}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{z-index:2;touch-action:none}#hud{position:fixed;z-index:3;top:0;left:0;right:0;padding:17px;background:linear-gradient(#000b,transparent);display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px #000}.tag{background:#102d25dd;border:2px solid #7fd5a6;border-radius:12px;padding:7px 10px}#gate{position:fixed;z-index:5;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 20%,#195545,#06100d 65%);padding:24px}.card{max-width:360px;background:#091a15eF;border:3px solid #73c99a;border-radius:24px;padding:25px}.card h1{margin:0 0 8px}.card p{line-height:1.45;color:#d5ece0}.card button{background:#3d9b69;color:white;border:2px solid #b9f2d1;border-radius:12px;padding:13px 18px;font-weight:900;font-size:16px}.small{font-size:12px;color:#a9cdbb}#state{position:fixed;z-index:3;bottom:18px;left:50%;transform:translateX(-50%);background:#06130ddd;border:1px solid #71c99d;border-radius:99px;padding:9px 13px;font-size:13px;white-space:nowrap}</style><video id="cam" autoplay playsinline muted></video><canvas id="game"></canvas><div id="hud"><div class="tag">MÃO MÁGICA</div><div class="tag" id="score">⭐ 0</div></div><div id="state">Mostre sua mão para a câmera</div><div id="gate"><div class="card"><h1>🖐️ Mão Mágica</h1><p>Controle a bolinha com o dedo indicador e pegue as estrelas. Sem tocar na tela.</p><button id="go">Abrir câmera e jogar</button><p class="small">Funciona melhor com boa luz e a câmera traseira.</p></div></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const video=document.querySelector("#cam"),canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),scoreEl=document.querySelector("#score"),state=document.querySelector("#state");let score=0,hand=null,star={x:.72,y:.45},pulse=0;function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener("resize",resize);resize();function spawn(){star={x:.15+Math.random()*.7,y:.22+Math.random()*.57}}function draw(){let w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);let sx=star.x*w,sy=star.y*h;ctx.save();ctx.translate(sx,sy);ctx.rotate(Date.now()/700);ctx.font="42px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("⭐",0,0);ctx.restore();if(hand){let x=(1-hand.x)*w,y=hand.y*h;ctx.beginPath();ctx.arc(x,y,29+pulse,0,7);ctx.fillStyle="#59e7a4aa";ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#e1ffeccc";ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(sx,sy);ctx.strokeStyle="#92ffd055";ctx.setLineDash([7,10]);ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([])}requestAnimationFrame(draw)}function result(r){if(!r.multiHandLandmarks||!r.multiHandLandmarks.length){hand=null;state.textContent="Mostre sua mão para a câmera";return}let p=r.multiHandLandmarks[0][8];hand={x:p.x,y:p.y};state.textContent="Mova o indicador até a estrela";let dx=(1-p.x)-star.x,dy=p.y-star.y;if(Math.hypot(dx,dy)<.075){score++;pulse=10;scoreEl.textContent="⭐ "+score;spawn();setTimeout(()=>pulse=0,120)}}async function start(){try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();document.querySelector("#gate").remove();let hands=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});hands.onResults(result);let camera=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:1280,height:720});camera.start()}catch(e){document.querySelector(".card p").textContent="Permita a câmera no Chrome e tente de novo."}}document.querySelector("#go").onclick=start;draw()</script></html>
