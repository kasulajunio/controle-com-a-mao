<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Poder na Mão</title><style>*{box-sizing:border-box}body{margin:0;background:#050b12;color:#fff;font-family:system-ui;overflow:hidden}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1)}canvas{z-index:2;touch-action:none}#top{position:fixed;z-index:3;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(#02060ccc,transparent);display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 3px #000}.pill{background:#0a1c26d9;border:1px solid #8bc8d9;border-radius:99px;padding:7px 10px;font-size:13px}#tip{position:fixed;z-index:3;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:88%;text-align:center;background:#06111bd9;border:1px solid #78bdd1;border-radius:14px;padding:10px 14px;font-size:13px}.gate{position:fixed;z-index:9;inset:0;display:grid;place-items:center;text-align:center;padding:22px;background:radial-gradient(circle at 50% 15%,#17455d,#050b12 64%)}.card{max-width:355px;background:#07141eee;border:2px solid #79b8ce;border-radius:22px;padding:24px}.card h1{margin:0 0 10px}.card p{line-height:1.45;color:#d5e9f0}.card button{background:#237b9b;border:2px solid #b4e7f3;border-radius:12px;color:white;padding:13px 18px;font-size:16px;font-weight:900}.small{font-size:12px;color:#a7c5cf}</style><video id="cam" autoplay playsinline muted></video><canvas id="fx"></canvas><div id="top"><div class="pill">🖐 PODER NA MÃO</div><div class="pill" id="hits">ACERTOS 0</div></div><div id="tip">Junte o indicador e o polegar para desenhar um poder.</div><div class="gate" id="gate"><div class="card"><h1>🖐 Poder na Mão</h1><p>Use a mão de verdade: junte o polegar com o indicador, desenhe no ar e solte para lançar o poder.</p><button id="go">Abrir câmera</button><p class="small">Boa luz ajuda bastante. A câmera só é usada no seu navegador para enxergar a mão.</p></div></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script>const v=document.querySelector("#cam"),c=document.querySelector("#fx"),g=c.getContext("2d"),tip=document.querySelector("#tip"),hits=document.querySelector("#hits");let w,h,hand=null,draw=[],pinching=false,shots=[],targets=[],score=0,lastT=0;function size(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener("resize",size);size();function target(){return{x:w*(.15+Math.random()*.7),y:h*(.2+Math.random()*.48),r:25+Math.random()*16,life:1}}for(let i=0;i<4;i++)target();function powerName(p){if(p.length<10)return"BOLA";let minX=Math.min(...p.map(a=>a.x)),maxX=Math.max(...p.map(a=>a.x)),minY=Math.min(...p.map(a=>a.y)),maxY=Math.max(...p.map(a=>a.y));return(maxX-minX>maxY-minY*1.7)?"RAIO":"PODER"}function launch(){if(draw.length<3)return;let a=draw[0],b=draw[draw.length-1],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;let name=powerName(draw);shots.push({x:b.x,y:b.y,vx:dx/len*13,vy:dy/len*13,path:draw.slice(-28),life:1,name:name});tip.textContent=name+" CRIADO! Ele foi lançado.";draw=[]}function circle(x,y,r,col){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill()}function frame(){g.clearRect(0,0,w,h);let now=performance.now();targets.forEach(t=>{t.y+=Math.sin(now/800+t.x)*.18;circle(t.x,t.y,t.r+8,"#ef4e6755");circle(t.x,t.y,t.r,"#a81d39cc");g.fillStyle="#ffe4b5";g.font="25px system-ui";g.textAlign="center";g.fillText("✹",t.x,t.y+9)});if(draw.length>1){g.beginPath();g.moveTo(draw[0].x,draw[0].y);for(let p of draw)g.lineTo(p.x,p.y);g.lineWidth=8;g.lineCap="round";g.strokeStyle="#78ebffcc";g.shadowColor="#30bfea";g.shadowBlur=20;g.stroke();g.shadowBlur=0;let p=draw[draw.length-1];circle(p.x,p.y,20,"#c8f7ffcc")}for(let s of shots){s.x+=s.vx;s.y+=s.vy;s.life-=.012;g.save();g.shadowColor="#55dfff";g.shadowBlur=25;g.strokeStyle="#9df5ff";g.lineWidth=6;g.lineCap="round";g.beginPath();s.path.forEach((p,i)=>i?g.lineTo(s.x+(p.x-s.path.at(-1).x)*.25,s.y+(p.y-s.path.at(-1).y)*.25):g.moveTo(s.x,s.y));g.stroke();circle(s.x,s.y,17,"#66ddffff");circle(s.x,s.y,8,"#ffffff");g.restore();for(let t of targets){if(Math.hypot(s.x-t.x,s.y-t.y)<t.r+18){t.x=-99;s.life=0;score++;hits.textContent="ACERTOS "+score;tip.textContent="ACERTO! Faça outro desenho.";setTimeout(target,250)}}}shots=shots.filter(s=>s.life>0&&s.x>-80&&s.x<w+80&&s.y>-80&&s.y<h+80);targets=targets.filter(t=>t.x>-50);if(hand){let x=(1-hand.x)*w,y=hand.y*h;circle(x,y,13,"#baf8ffcc");g.beginPath();g.arc(x,y,23,0,7);g.strokeStyle="#e6ffff";g.lineWidth=3;g.stroke()}requestAnimationFrame(frame)}function onResults(r){let lm=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!lm){hand=null;return}let i=lm[8],th=lm[4],x=1-i.x,y=i.y,tx=1-th.x,ty=th.y;hand={x:i.x,y:i.y};let close=Math.hypot(x-tx,y-ty)<.075,now=performance.now();if(close){if(!pinching){draw=[];tip.textContent="DESENHANDO... solte para lançar"}pinching=true;if(!draw.length||now-lastT>22){draw.push({x:x*w,y:y*h});lastT=now}}else if(pinching){pinching=false;launch()}}async function play(){try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1280},height:{ideal:720}},audio:false});await v.play();document.querySelector("#gate").remove();let hands=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});hands.onResults(onResults);let camera=new Camera(v,{onFrame:async()=>{await hands.send({image:v})},width:1280,height:720});camera.start()}catch(e){tip.textContent="Permita a câmera no Chrome e abra o jogo de novo."}}document.querySelector("#go").onclick=play;frame()</script></html>
